name: Desktop CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            bundle: dmg
            target: --target universal-apple-darwin
            artifact: lusi-macos-universal
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - runner: windows-2025
            bundle: nsis
            artifact: lusi-windows-x64
            path: src-tauri/target/release/bundle/nsis/*.exe
          - runner: ubuntu-22.04
            bundle: deb,appimage
            artifact: lusi-linux-x64
            path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - name: Prepare the universal macOS build
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils xvfb xauth
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundle }} ${{ matrix.target }} -- --locked
      - name: Verify and launch the macOS bundle
        if: runner.os == 'macOS'
        run: |
          dmg=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          mount=$(mktemp -d)
          hdiutil verify "${dmg[0]}"
          hdiutil attach "${dmg[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Lusi.app/Contents/MacOS/lusi"
          lipo -verify_arch arm64 x86_64 "$app"
          "$app" &
          pid=$!
          sleep 5
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
      - name: Install and launch on Windows
        if: runner.os == 'Windows'
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected one Lusi installer' }
          $destination = Join-Path $env:RUNNER_TEMP 'Lusi-smoke'
          $setup = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Lusi installer exited with code $($setup.ExitCode)" }
          $app = Start-Process -FilePath (Join-Path $destination 'lusi.exe') -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Lusi exited with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Install the Debian package and check the AppImage
        if: runner.os == 'Linux'
        run: |
          deb=(src-tauri/target/release/bundle/deb/*.deb)
          appimage=(src-tauri/target/release/bundle/appimage/*.AppImage)
          sudo apt-get install -y "$(realpath "${deb[0]}")"
          status=0
          timeout 8s xvfb-run -a lusi || status=$?
          test "$status" -eq 124
          image=$(realpath "${appimage[0]}")
          cd "$RUNNER_TEMP"
          "$image" --appimage-extract > appimage-contents.txt
          test -x squashfs-root/AppRun
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm audit --audit-level=moderate
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock
