<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lusi app icon</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }

      body { margin: 0; background: #edf0f6; color: #172136; }
      main { max-width: 760px; margin: 0 auto; padding: 32px 20px; }
      h1 { margin: 0 0 20px; font-size: 26px; letter-spacing: -.035em; }
      h2 { margin: 0; font-size: 14px; font-weight: 620; }
      .previews { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
      .stage { display: grid; justify-items: center; gap: 14px; padding: 24px 14px 18px; border-radius: 24px; background: #fff; }
      .stage-dark { background: #181e2e; color: #f1f3fa; }
      .sizes { display: flex; align-items: end; gap: 14px; }

      .app-icon {
        --icon-size: 168px;
        display: grid;
        position: relative;
        place-items: center;
        isolation: isolate;
        width: var(--icon-size);
        aspect-ratio: 1;
        font-size: var(--icon-size);
      }

      .app-icon::before {
        position: absolute;
        z-index: -1;
        inset: 8%;
        border-radius: 24%;
        background: linear-gradient(148deg, #fff 14%, #f5f7fc 70%, #e6ecf7);
        box-shadow: inset 0 .006em .009em rgb(255 255 255 / 95%),
          inset 0 0 0 .003em rgb(77 97 147 / 12%),
          0 .009em .017em rgb(26 42 79 / 22%);
        content: "";
      }

      .app-icon img { display: block; width: 104%; height: auto; transform: translate(1%, -3%); }
      .small { --icon-size: 48px; }
      .tiny { --icon-size: 32px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Lusi app icon</h1>
      <div class="previews">
        <section class="stage" aria-labelledby="light">
          <h2 id="light">Light desktop</h2>
          <div id="app-icon" class="app-icon" role="img" aria-label="Blue and violet Lusi bird on a light tile"><img src="./lusi-color-source.png" alt="" /></div>
          <div class="sizes" aria-hidden="true">
            <div class="app-icon small"><img src="./lusi-color-source.png" alt="" /></div>
            <div class="app-icon tiny"><img src="./lusi-color-source.png" alt="" /></div>
          </div>
        </section>
        <section class="stage stage-dark" aria-labelledby="dark">
          <h2 id="dark">Dark desktop</h2>
          <div class="app-icon" role="img" aria-label="Blue and violet Lusi bird on a light tile"><img src="./lusi-color-source.png" alt="" /></div>
          <div class="sizes" aria-hidden="true">
            <div class="app-icon small"><img src="./lusi-color-source.png" alt="" /></div>
            <div class="app-icon tiny"><img src="./lusi-color-source.png" alt="" /></div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
